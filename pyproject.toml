[project]
name = "vector-gridiron"
version = "0.6.0"
description = "MTNN gridiron fantasy cockpit – claimed MAE 4.268, Procrustes era alignment, Vercel static"
readme = "README.md"
requires-python = ">=3.11"
license = {text="MIT"}
authors = [{name="Cam"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.0",
  # Shared fleet utilities: RealMLP preproc + audit, PLEmbedding (torch-gated),
  # Procrustes era alignment. Replaces the repo-local duplicates (parity-proven, 0.0 diff).
  "vector-core[torch] @ git+https://github.com/jcdavis131/vector-hub.git#subdirectory=packages/vector-core",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.2","pre-commit>=3.5","pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# vector-core is pulled straight from vector-hub's git repo (see the
# dependency above) rather than PyPI. Hatchling refuses to build metadata
# for a direct git/URL reference unless this is explicitly opted in --
# without it, `pip install .` / `pip install -e ".[dev]"` fails outright
# with "Dependency ... cannot be a direct reference".
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# This project ships no importable `vector_gridiron` package -- it's a flat
# collection of scripts (pipeline/, scripts/, operator/, bench/) invoked
# directly (`python pipeline/train_mtnn.py`), plus a static site. Hatchling's
# default wheel file-selection heuristic looks for a source dir matching the
# project name and errors out ("Unable to determine which files to ship")
# when none exists. `pip install -e .` is only used here to install the
# dependency set (torch/pandas/vector-core/etc.) for local dev + CI, so skip
# file selection entirely rather than inventing a fake package layout.
bypass-selection = true

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["assets/*","data/*","__pycache__",".venv","dist",".git"]

[tool.ruff.lint]
select = ["E","W","F","I","B","C4","UP","N","S","PTH","TCH","RUF"]
# N806/N812: allow conventional ML/math variable names (X, W, N, etc.) in function bodies.
# RUF001/RUF003: the training scripts print dimensions as 17x64 with a real multiplication sign
# and name sigma by its letter; flagging those as typos is noise (same choice as pitch, unified, dottie).
ignore = ["S101","S603","S607","N803","N806","N812","S110","E501","RUF001","RUF003"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"assets/*" = ["ALL"]
"scripts/*" = ["S","TCH","E402"]
# Data-fetch scripts (same convention as scripts/*): S = audited urllib/subprocess/random
# usage in the resumable fetcher; E722 = deliberate bare-excepts that must keep catching
# everything so a backfill never crashes mid-run (narrowing them would change behavior).
"pipeline/fetch_*.py" = ["S","E722"]

[tool.ruff.lint.isort]
known-first-party = ["assets","scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests","scripts","assets"]
python_files = ["test_*.py"]
addopts = "-q"
